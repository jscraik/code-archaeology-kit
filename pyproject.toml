[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "code-archaeology-kit"
version = "0.1.0"
description = "Standalone code archaeology CLI for git repositories"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "jscraik" }]
dependencies = ["jsonschema>=4.26.0,<5.0.0"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0.0"]

[project.scripts]
cak = "code_archaeology.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"
